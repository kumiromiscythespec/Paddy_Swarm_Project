<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><rect width="1200" height="820" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#17324c;font-size:18px}</style><text x="30" y="40" style="font-size:26px">Segmented witness-paper layout</text><text x="30" y="75">Exact CAD zone coordinates; labels are on paper only, not on seal faces.</text><g transform="translate(380,360) scale(7,-7)"><rect x="-24" y="-24" width="48" height="48" rx="1.5" fill="#e4edf5" stroke="#17324c" stroke-width=".15"/><rect x="14.0" y="-6.0" width="8" height="12" fill="#fff" stroke="#3c7299" stroke-width=".12"/><g transform="translate(18,0) scale(1,-1)"><text text-anchor="middle" dominant-baseline="middle" style="font-size:1.4px">FRONT</text></g><rect x="-22.0" y="-6.0" width="8" height="12" fill="#fff" stroke="#3c7299" stroke-width=".12"/><g transform="translate(-18,0) scale(1,-1)"><text text-anchor="middle" dominant-baseline="middle" style="font-size:1.4px">REAR</text></g><rect x="-6.0" y="14.0" width="12" height="8" fill="#fff" stroke="#3c7299" stroke-width=".12"/><g transform="translate(0,18) scale(1,-1)"><text text-anchor="middle" dominant-baseline="middle" style="font-size:1.4px">LEFT</text></g><rect x="-6.0" y="-22.0" width="12" height="8" fill="#fff" stroke="#3c7299" stroke-width=".12"/><g transform="translate(0,-18) scale(1,-1)"><text text-anchor="middle" dominant-baseline="middle" style="font-size:1.4px">RIGHT</text></g><rect x="10.0" y="10.0" width="12" height="12" fill="#fff" stroke="#3c7299" stroke-width=".12"/><g transform="translate(16,16) scale(1,-1)"><text text-anchor="middle" dominant-baseline="middle" style="font-size:1.4px">CORNER1</text></g><rect x="-22.0" y="10.0" width="12" height="12" fill="#fff" stroke="#3c7299" stroke-width=".12"/><g transform="translate(-16,16) scale(1,-1)"><text text-anchor="middle" dominant-baseline="middle" style="font-size:1.4px">CORNER2</text></g><rect x="-22.0" y="-22.0" width="12" height="12" fill="#fff" stroke="#3c7299" stroke-width=".12"/><g transform="translate(-16,-16) scale(1,-1)"><text text-anchor="middle" dominant-baseline="middle" style="font-size:1.4px">CORNER3</text></g><rect x="10.0" y="-22.0" width="12" height="12" fill="#fff" stroke="#3c7299" stroke-width=".12"/><g transform="translate(16,-16) scale(1,-1)"><text text-anchor="middle" dominant-baseline="middle" style="font-size:1.4px">CORNER4</text></g></g><text x="690" y="240">FRONT = +X; LEFT = +Y</text><text x="690" y="280">8 separate paper zones</text><text x="690" y="320">Do not bridge the gasket</text><text x="690" y="360">Floor datum Z3.5</text><text x="30" y="640">Upright60 min; external observation at10 and30 min. Do not open during the60 min stage.</text><text x="30" y="670">Then if PASS: four tilts greater than10 degrees,10 min each.</text><text x="30" y="700">Record first wet zone; wipe all exterior water away before opening.</text><text x="30" y="803" style="font-size:14px">PS-WP-TPU-FACE-GASKET-V001 | mm | CAD geometry only; WATER PHYSICAL TEST PENDING</text></svg>