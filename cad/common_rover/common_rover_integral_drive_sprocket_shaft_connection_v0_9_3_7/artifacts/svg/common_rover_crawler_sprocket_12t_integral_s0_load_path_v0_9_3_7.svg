<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f7f8fa"/><text x="40" y="50" font-family="sans-serif" font-size="28" font-weight="bold">Symmetric torque load path</text><text x="40" y="82" font-family="sans-serif" font-size="17" fill="#a22">S0 DRY FIT ONLY · NO POWER · NO LOAD</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a33"/></marker></defs><rect x="35" y="280" width="140" height="100" rx="12" fill="#dce9f1" stroke="#245" stroke-width="2"/><text x="105" y="335" text-anchor="middle" font-family="sans-serif" font-size="16">10 mm shaft</text><path d="M175,330 L200,330" stroke="#a33" stroke-width="4" marker-end="url(#a)"/><rect x="200" y="280" width="140" height="100" rx="12" fill="#dce9f1" stroke="#245" stroke-width="2"/><text x="270" y="335" text-anchor="middle" font-family="sans-serif" font-size="16">circumferential clamp</text><path d="M340,330 L365,330" stroke="#a33" stroke-width="4" marker-end="url(#a)"/><rect x="365" y="280" width="140" height="100" rx="12" fill="#dce9f1" stroke="#245" stroke-width="2"/><text x="435" y="335" text-anchor="middle" font-family="sans-serif" font-size="16">H0 flange</text><path d="M505,330 L530,330" stroke="#a33" stroke-width="4" marker-end="url(#a)"/><rect x="530" y="280" width="140" height="100" rx="12" fill="#dce9f1" stroke="#245" stroke-width="2"/><text x="600" y="335" text-anchor="middle" font-family="sans-serif" font-size="16">4 metal axial fasteners</text><path d="M670,330 L695,330" stroke="#a33" stroke-width="4" marker-end="url(#a)"/><rect x="695" y="280" width="140" height="100" rx="12" fill="#dce9f1" stroke="#245" stroke-width="2"/><text x="765" y="335" text-anchor="middle" font-family="sans-serif" font-size="16">S0 body/root</text><path d="M835,330 L860,330" stroke="#a33" stroke-width="4" marker-end="url(#a)"/><rect x="860" y="280" width="140" height="100" rx="12" fill="#dce9f1" stroke="#245" stroke-width="2"/><text x="930" y="335" text-anchor="middle" font-family="sans-serif" font-size="16">12 teeth</text><path d="M1000,330 L1025,330" stroke="#a33" stroke-width="4" marker-end="url(#a)"/><rect x="1025" y="280" width="140" height="100" rx="12" fill="#dce9f1" stroke="#245" stroke-width="2"/><text x="1095" y="335" text-anchor="middle" font-family="sans-serif" font-size="16">crawler links</text><text x="50" y="500" font-family="sans-serif" font-size="19">No adhesive · no PETG tapped set screw · no D-flat · no keyway · reversible disassembly</text></svg>
