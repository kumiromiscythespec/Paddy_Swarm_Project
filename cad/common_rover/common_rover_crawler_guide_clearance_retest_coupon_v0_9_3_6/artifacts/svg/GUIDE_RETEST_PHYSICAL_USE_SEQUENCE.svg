<rect width="100%" height="100%" fill="#f7f8fa"/><text x="40" y="48" font-family="sans-serif" font-size="28" font-weight="bold">Physical use sequence</text>
<text x="40" y="78" font-family="sans-serif" font-size="16" fill="#a22">FIT TEST ONLY · NO POWER · NO LOAD</text><rect x="80" y="160" width="310" height="130" rx="18" fill="#def" stroke="#245" stroke-width="2"/><text x="100" y="215" font-family="sans-serif" font-size="18">1 Print all three plates identically</text><rect x="450" y="160" width="310" height="130" rx="18" fill="#def" stroke="#245" stroke-width="2"/><text x="470" y="215" font-family="sans-serif" font-size="18">2 Measure all nine stations</text><rect x="820" y="160" width="310" height="130" rx="18" fill="#def" stroke="#245" stroke-width="2"/><text x="840" y="215" font-family="sans-serif" font-size="18">3 Start W54.4 / A40</text><rect x="80" y="410" width="310" height="130" rx="18" fill="#def" stroke="#245" stroke-width="2"/><text x="100" y="465" font-family="sans-serif" font-size="18">4 Test centered and lateral fit</text><rect x="450" y="410" width="310" height="130" rx="18" fill="#def" stroke="#245" stroke-width="2"/><text x="470" y="465" font-family="sans-serif" font-size="18">5 Test forward/reverse and 3-link twist</text><rect x="820" y="410" width="310" height="130" rx="18" fill="#def" stroke="#245" stroke-width="2"/><text x="840" y="465" font-family="sans-serif" font-size="18">6 Record PASS / HOLD / FAIL; final selection HOLD</text></svg>
