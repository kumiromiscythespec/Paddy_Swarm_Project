<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#245ca6"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#17212b}.t{font-size:30px;font-weight:700}.s{font-size:18px;fill:#455}.n{font-size:18px}.b{fill:#dbeafe;stroke:#245ca6;stroke-width:3}.g{fill:#dcfce7;stroke:#087f5b;stroke-width:3}.q{fill:#fff7ed;stroke:#c2410c;stroke-width:3}.r{fill:#fee2e2;stroke:#b91c1c;stroke-width:3}.a{stroke:#245ca6;stroke-width:4;marker-end:url(#a)}.d{stroke:#8b1e3f;stroke-width:3}</style><text x="55" y="60" class="t">PHYSICAL SELECTION SEQUENCE</text><text x="55" y="95" class="s">Largest candidate is not automatically selected; contamination clearance remains important.</text><rect x="80" y="210" width="230" height="180" class="b"/><text x="165" y="305" class="n">A FIRST</text><path d="M330 300H450" class="a"/><rect x="470" y="210" width="230" height="180" class="g"/><text x="545" y="285" class="n">B PRIMARY</text><text x="525" y="325" class="n">if A passes</text><path d="M720 300H840" class="a"/><rect x="860" y="210" width="230" height="180" class="q"/><text x="945" y="285" class="n">C ONLY</text><text x="895" y="325" class="n">with clear margin</text><text x="155" y="490" class="n">Each: natural seat → rock → withdraw → 5 cycles → inspect tooth and link</text><text x="240" y="545" class="n">Pitch / pitch diameter / powered crawler test remain HOLD.</text></svg>
