<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#17324a}.rail{fill:#aeb8c2;stroke:#455a64;stroke-width:3}.saddle{fill:#ffd998;stroke:#b66a00;stroke-width:3}.cbox{fill:#bfe9f5;stroke:#007596;stroke-width:3}.bbox{fill:#cfead6;stroke:#26734d;stroke-width:3}.dim{fill:none;stroke:#d05224;stroke-width:2}.old{fill:none;stroke:#8d65ad;stroke-width:3;stroke-dasharray:8 6}</style><text x="30" y="45" font-size="27">CBOX support/load path</text><rect class="cbox" x="175" y="150" width="850" height="120"/><rect class="saddle" x="210" y="270" width="780" height="180"/><rect class="rail" x="340" y="450" width="520" height="130"/><line class="dim" x1="920" y1="270" x2="920" y2="450"/><text x="935" y="370" font-size="20">rise +8 mm</text><text x="390" y="235" font-size="20">CBOX on PETG support, not M5 head</text><text x="30" y="650" font-size="17">CBOX → PETG support → saddle foot → rail → M5/T-nut retention.</text><text x="30" y="680" font-size="17">CBOX does not rest on screw heads or BBOX lid.</text><text x="30" y="782" font-size="14">CBOX TOP-T-SLOT SADDLE V002 | COUPON FIRST | FULL SADDLE PRINT HOLD</text></svg>
