<text x="650" y="175">X=0 to X=22: exact working length</text><text x="650" y="225">Two end faces: 18 x 8 mm each</text><text x="650" y="275">Top engraving 22: 0.6 mm deep</text><text x="650" y="325">Measure end patches at Z2..6 mm</text><text x="650" y="390" class="hold">NO mounting holes / NO shaft bore</text><text x="650" y="430" class="hold">NOT a permanent bearing spacer</text><text x="30" y="645">PETG; flat bottom Z0; support OFF. Check first-layer expansion away from measurement patches.</text><text x="30" y="676">Identify physical face B and offset direction before using the gauge against member-end datum A.</text><text x="30" y="707">Secure the assembly independently and REMOVE ALL GAUGES before hand rotation.</text><text x="30" y="781" style="font-size:14px">PTO OFFSET TEST V001 | NON-LOAD-BEARING GAUGES | PHYSICAL CLEARANCE TEST PENDING</text></svg>
