<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#18334a;font-size:18px}.dim{stroke:#136f93;stroke-width:2;fill:none}.hold{fill:#9c4316}</style><text x="30" y="42" style="font-size:26px">60T / KP000 — measured span comparison</text><text x="30" y="78">The circle is a radial reference, not exact pulley teeth or a complete runout envelope.</text><circle cx="300" cy="355" r="185.185" fill="#fff1df" stroke="#b66516" stroke-width="3"/><rect x="177.715" y="315" width="244.57" height="80" fill="#c8e1e8" stroke="#136f93"/><line x1="300" y1="150" x2="300" y2="560" stroke="#566776" stroke-dasharray="6 6"/><text x="165" y="585">Centered projection comparison only</text><text x="570" y="200">60T measured maximum: 100.1 mm</text><text x="570" y="250">KP000 measured relevant span: 66.1 mm</text><text x="570" y="315">(100.1 - 66.1) / 2 = 17.0 mm per side</text><text x="570" y="375">PHYSICAL_DERIVED, not a measured gap</text><text x="570" y="450" class="hold">CAD references: 60T 102.0; KP000 67.0 mm</text><text x="570" y="495" class="hold">No proof these centers coincide when installed</text><text x="30" y="645">CAD-minus-physical differences: 60T +1.9 mm; KP000 +0.9 mm. Existing source CAD is unchanged.</text><text x="30" y="676">20T is not dominant by the latest physical observation; no new exact 20T OD is inferred.</text><text x="30" y="707">Existing 20T reference STEP is retained separately at its earlier measured flange OD34.8 mm.</text><text x="30" y="781" style="font-size:14px">PTO OFFSET TEST V001 | NON-LOAD-BEARING GAUGES | PHYSICAL CLEARANCE TEST PENDING</text></svg>
