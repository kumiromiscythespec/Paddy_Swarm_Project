<text x="835" y="460">P25: 25.0 x 18 x 8 mm</text><text x="835" y="505">Residual reference: 8.0 mm</text><text x="835" y="550" class="hold">PHYSICAL TEST PENDING</text><text x="30" y="645">Shortest acceptable candidate is selected only after real registration, tool access and full hand rotation.</text><text x="30" y="676">Optional triplet STL contains three separate parts, no connecting sprue or shared working surface.</text><text x="30" y="707">No torque, belt-tension, structural or powered approval is granted.</text><text x="30" y="781" style="font-size:14px">PTO OFFSET TEST V001 | NON-LOAD-BEARING GAUGES | PHYSICAL CLEARANCE TEST PENDING</text></svg>
