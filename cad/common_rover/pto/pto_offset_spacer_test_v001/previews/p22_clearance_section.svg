<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#18334a;font-size:18px}.dim{stroke:#136f93;stroke-width:2;fill:none}.hold{fill:#9c4316}</style><text x="30" y="42" style="font-size:26px">P22 — datum / clearance interpretation</text><text x="30" y="78">NOT an installed PTO section. No old global-X or L-bracket datum is used.</text><rect x="65" y="235" width="300" height="160" fill="#d2dee8" stroke="#18334a"/><text x="80" y="430">Frame-end reference excerpt</text><rect x="365" y="275" width="198.0" height="72" fill="#9cd7e7" stroke="#136f93"/><line x1="365" y1="170" x2="365" y2="455" class="dim"/><line x1="563.0" y1="170" x2="563.0" y2="455" stroke="#bd6319" stroke-dasharray="8 5" stroke-width="2"/><line x1="365" y1="205" x2="563.0" y2="205" class="dim"/><text x="436.0" y="190">22.0 mm</text><text x="285" y="490">A: LOCAL X0</text><text x="573.0" y="240" class="hold">B: gauge face only</text><text x="573.0" y="280" class="hold">KP000 mating face not identified</text><text x="573.0" y="360">Nominal residual = 22 - 17 = 5.0 mm</text><text x="573.0" y="405" class="hold">Actual 60T minimum clearance: HOLD</text><text x="30" y="645">Only the two GAUGE faces establish the indicated separation. There is no released KP000 mounting stack.</text><text x="30" y="676">3 / 5 / 8 mm are derived design references, not physical clearances or installed-CAD PASS results.</text><text x="30" y="707">PTO axis local X and full-rotation clearance require measured component registration.</text><text x="30" y="781" style="font-size:14px">PTO OFFSET TEST V001 | NON-LOAD-BEARING GAUGES | PHYSICAL CLEARANCE TEST PENDING</text></svg>
