<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#17202a}.t{font-size:28px;font-weight:bold}.l{font-size:18px}.s{font-size:14px}.o{fill:none;stroke:#264653;stroke-width:4}.a{fill:none;stroke:#e76f51;stroke-width:5}.b{fill:none;stroke:#2a9d8f;stroke-width:5}.f{fill:#d8f3dc;stroke:#2d6a4f;stroke-width:3}.h{fill:#ffe8d6;stroke:#9c6644;stroke-width:3}.d{stroke:#457b9d;stroke-width:3;fill:none}</style><text x="30" y="44" class="t">Dry dual-motor test sequence</text><g transform="translate(55,135)"><g class="h"><rect x="0" y="0" width="150" height="90" rx="12"/><rect x="180" y="0" width="150" height="90" rx="12"/><rect x="360" y="0" width="150" height="90" rx="12"/><rect x="540" y="0" width="150" height="90" rx="12"/><rect x="720" y="0" width="150" height="90" rx="12"/><rect x="900" y="0" width="150" height="90" rx="12"/></g><text x="28" y="38" class="l">TEMP side</text><text x="48" y="65" class="l">1–2 s</text><text x="220" y="52" class="l">inspect</text><text x="405" y="52" class="l">5 s</text><text x="580" y="52" class="l">inspect</text><text x="756" y="52" class="l">10 s</text><text x="940" y="52" class="l">inspect</text><path d="M150 45H180M330 45H360M510 45H540M690 45H720M870 45H900" class="d"/><text x="0" y="180" class="l">Then dual motor: 1–2 s → inspect → 5 s → inspect → 10 s → inspect.</text><text x="0" y="235" class="l">Stop on slip, skip, climb, walk, wobble, whitening, crack, loosening, sound, asymmetry.</text><text x="0" y="300" class="l">Never stall / block crawler / restrain vehicle / pull payload / run mud, water, field or unattended.</text></g><text x="30" y="678" class="s">v0.9.6.21 · DRY / SHORT-DURATION / LOW-LOAD ONLY · FULL TORQUE / WATER / MUD / FIELD NOT APPROVED</text></svg>
