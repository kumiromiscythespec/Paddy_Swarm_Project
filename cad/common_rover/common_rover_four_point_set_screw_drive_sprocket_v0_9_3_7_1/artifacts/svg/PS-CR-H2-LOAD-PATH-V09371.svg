<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f7f8fa"/><text x="40" y="52" font-family="sans-serif" font-size="28" font-weight="bold">H2 symmetric torque path</text><text x="40" y="84" font-family="sans-serif" font-size="17" fill="#a22">H2 PHYSICAL TEST REQUIRED · NO POWER · NO LOAD</text><rect x="70" y="285" width="150" height="90" rx="12" fill="#dce9f1" stroke="#245"/><rect x="280" y="285" width="150" height="90" rx="12" fill="#dce9f1" stroke="#245"/><rect x="490" y="285" width="150" height="90" rx="12" fill="#dce9f1" stroke="#245"/><rect x="700" y="285" width="150" height="90" rx="12" fill="#dce9f1" stroke="#245"/><rect x="910" y="285" width="150" height="90" rx="12" fill="#dce9f1" stroke="#245"/><text x="145" y="340" text-anchor="middle" font-family="sans-serif" font-size="18">10 mm shaft</text><text x="355" y="340" text-anchor="middle" font-family="sans-serif" font-size="18">4 set screws</text><text x="565" y="340" text-anchor="middle" font-family="sans-serif" font-size="18">4 high nuts</text><text x="775" y="340" text-anchor="middle" font-family="sans-serif" font-size="18">PETG hub/root</text><text x="985" y="340" text-anchor="middle" font-family="sans-serif" font-size="18">12T links</text><path d="M220 330H280M430 330H490M640 330H700M850 330H910" stroke="#a33" stroke-width="5"/><text x="235" y="500" font-family="sans-serif" font-size="20">Retainer prevents axial nut loss; it is not the primary torque path.</text></svg>
