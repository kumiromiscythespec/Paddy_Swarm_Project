<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f7f8fa"/><text x="40" y="52" font-family="sans-serif" font-size="28" font-weight="bold">Symmetric tightening sequence</text><text x="40" y="84" font-family="sans-serif" font-size="17" fill="#a22">H2 PHYSICAL TEST REQUIRED · NO POWER · NO LOAD</text><circle cx="250" cy="230" r="85" fill="#dce9f1" stroke="#245" stroke-width="3"/><text x="250" y="240" text-anchor="middle" font-family="sans-serif" font-size="28">1 A1</text><circle cx="700" cy="230" r="85" fill="#dce9f1" stroke="#245" stroke-width="3"/><text x="700" y="240" text-anchor="middle" font-family="sans-serif" font-size="28">2 A2</text><circle cx="250" cy="490" r="85" fill="#dce9f1" stroke="#245" stroke-width="3"/><text x="250" y="500" text-anchor="middle" font-family="sans-serif" font-size="28">3 B1</text><circle cx="700" cy="490" r="85" fill="#dce9f1" stroke="#245" stroke-width="3"/><text x="700" y="500" text-anchor="middle" font-family="sans-serif" font-size="28">4 B2</text><text x="900" y="310" font-family="sans-serif" font-size="21">then 1/8 turn each</text><text x="900" y="355" font-family="sans-serif" font-size="21">repeat only if needed</text></svg>
