<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8 Z" fill="context-stroke"/>
</marker>
<style>text{font-family:"Yu Gothic","Noto Sans CJK JP",sans-serif;fill:#17212b}.title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#455a64}.node{stroke:#263238;stroke-width:2}.label{font-size:17px;font-weight:600;text-anchor:middle}.edge{fill:none;stroke-width:4;marker-end:url(#arrow)}.edge-label{font-size:14px;text-anchor:middle}.note{font-size:15px}</style>
</defs>
<rect width="1200" height="700" fill="#f7fafc"/>
<text x="50" y="48" class="title">個別隔離手順</text>
<text x="50" y="78" class="sub">上部給水を止めて排水完了後に均水弁を閉じる</text>
<path d="M250,275 L320,275" class="edge" stroke="#d84315"/>
<path d="M500,275 L570,275" class="edge" stroke="#d84315"/>
<path d="M750,275 L820,275" class="edge" stroke="#d84315"/>
<path d="M910,320 L910,410" class="edge" stroke="#d84315"/>
<rect x="70" y="230" width="180" height="90" rx="12" class="node" fill="#ffdcdc"/>
<text x="160" y="265" class="label">
<tspan x="160" dy="0">上部給水弁</tspan>
<tspan x="160" dy="22">1 閉鎖</tspan>
</text>
<rect x="320" y="230" width="180" height="90" rx="12" class="node" fill="#dcf5e6"/>
<text x="410" y="265" class="label">
<tspan x="410" dy="0">タワー</tspan>
<tspan x="410" dy="22">2 排水待ち</tspan>
</text>
<rect x="570" y="230" width="180" height="90" rx="12" class="node" fill="#d8ecff"/>
<text x="660" y="265" class="label">
<tspan x="660" dy="0">ローカルサンプ</tspan>
<tspan x="660" dy="22">3 水位安定確認</tspan>
</text>
<rect x="820" y="230" width="180" height="90" rx="12" class="node" fill="#fff0c7"/>
<text x="910" y="265" class="label">
<tspan x="910" dy="0">均水弁</tspan>
<tspan x="910" dy="22">4 ゆっくり閉鎖</tspan>
</text>
<rect x="820" y="410" width="180" height="90" rx="12" class="node" fill="#e9eef2"/>
<text x="910" y="445" class="label">
<tspan x="910" dy="0">整備・切離し</tspan>
<tspan x="910" dy="22">5</tspan>
</text>
<text x="50" y="610" class="note">• 均水弁を先に閉じたまま給水継続は禁止</text>
<text x="50" y="634" class="note">• 再接続前に清掃、EC/pH、水位整合、漏れ確認を行う</text>
</svg>
